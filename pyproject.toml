[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apex"
version = "0.0.0"
description = "Warehouse simulation and multi-agent planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "simpy>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pyyaml>=6.0",
]
eval = [
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]
llm = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]
viz = [
    "pygame-ce>=2.5",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
