[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apex"
version = "0.0.0"
description = "Warehouse simulation and multi-agent planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "simpy>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
viz = [
    "pygame-ce>=2.5",
]
gnn = [
    "torch>=2.1",
    "torch-geometric>=2.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
